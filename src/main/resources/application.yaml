spring:
  application:
    name: KnowledgeOS

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  ai:
    openai:
      api-key: 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
      base-url: https://openrouter.ai/api

      chat:
        options:
          model: nvidia/nemotron-3.5-lightning:free
          temperature: 0.0

      embedding:
        options:
          model: nvidia/nemotron-3-embed-1b:free

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/knowledgeos}
    username: ${DB_USERNAME:knowledgeos}
    password: ${DB_PASSWORD:knowledgeos}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: false
        jdbc.time_zone: UTC

  sql:
    init:
      mode: always
      continue-on-error: true

jwt:
  secret-key: gjkfsoidfkfmvmc0wrep3rodfdssf0dsfuenfiouerohihfjheoijnfiouehrs1d65f651sdf

logging:
  level:
    com.example.KnowledgeOS: DEBUG
    org.springframework.ai.chat.client: INFO

minio:
  url: ${MINIO_URL:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:knowledgeos-documents}

knowledgeos:
  rag:
    lexical:
      top-k: 20
    semantic:
      top-k: 20
      similarity-threshold: 0.25
    fusion:
      top-k: 20
      rrf-k: 60.0
    reranker:
      top-k: 5
      enabled: true
    final-context:
      top-k: 5

app:
  mail:
    from: ${GMAIL_USERNAME}
#  frontend-url: ${KNOWLEDGEOS_FRONTEND_URL:http://localhost:5173}